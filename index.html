<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Snap & Savory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1614;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: #26201d;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 700;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 16, 14, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 2.2rem; color: #ff9f1c; margin-bottom: 8px; }
    p { font-size: 1rem; color: #dcd6d0; margin-bottom: 20px; line-height: 1.5; }
    button {
      background: #ff9f1c;
      color: #1a1614;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 159, 28, 0.4);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div id="lives">❤️❤️❤️</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="overlay">
    <h1>📸 Snap & Savory</h1>
    <p>
      Tap to <strong>SNAP</strong> a photo when <strong>SAVORY</strong> food enters the camera frame!<br><br>
      🥟🍕🌮 = <strong>TAP!</strong><br>
      🍩🧁🔥 = <strong>DON'T TAP!</strong>
    </p>
    <button id="start-btn">START SHIFT</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>Shift Over!</h1>
    <p id="final-score">Final Score: 0</p>
    <button id="restart-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const finalScoreEl = document.getElementById("final-score");

  // Resize canvas to match container
  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  // Food items database
  const SAVORY_ITEMS = ["🥟", "🍕", "🌮", "🍔", "🍜", "🍟", "🌯", "🍗", "🥨"];
  const AVOID_ITEMS  = ["🍩", "🧁", "🍦", "🍰", "🍪", "🔥", "🍬"];

  // Game state
  let score = 0;
  let lives = 3;
  let speed = 3.5;
  let items = [];
  let spawnTimer = 0;
  let flashAlpha = 0;
  let feedbackText = "";
  let feedbackColor = "#fff";
  let feedbackTimer = 0;
  let isRunning = false;
  let beltOffset = 0;

  // Camera target zone dimensions
  function getTargetZone() {
    const size = 120;
    return {
      x: canvas.width / 2 - size / 2,
      y: canvas.height / 2 - size / 2,
      w: size,
      h: size,
      centerX: canvas.width / 2
    };
  }

  function spawnItem() {
    const isSavory = Math.random() < 0.65; // 65% chance of savory dish
    const pool = isSavory ? SAVORY_ITEMS : AVOID_ITEMS;
    const emoji = pool[Math.floor(Math.random() * pool.length)];

    items.push({
      x: -50,
      y: canvas.height / 2,
      emoji,
      isSavory,
      snapped: false,
      missed: false
    });
  }

  function showFeedback(text, color) {
    feedbackText = text;
    feedbackColor = color;
    feedbackTimer = 40;
  }

  function loseLife(reason) {
    lives--;
    livesEl.textContent = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(3 - Math.max(0, lives));
    showFeedback(reason, "#ff4d4d");
    if (lives <= 0) {
      isRunning = false;
      finalScoreEl.textContent = `Final Score: ${score}`;
      gameoverScreen.classList.remove("hidden");
    }
  }

  // Handle Tap / Click
  function handleSnap() {
    if (!isRunning) return;

    flashAlpha = 0.8; // Camera flash effect
    const zone = getTargetZone();

    // Find item closest to the center of the camera box
    let targetItem = null;
    let minDist = Infinity;

    for (const item of items) {
      if (item.snapped) continue;
      const dist = Math.abs(item.x - zone.centerX);
      if (dist < zone.w * 0.65 && dist < minDist) {
        minDist = dist;
        targetItem = item;
      }
    }

    if (!targetItem) {
      showFeedback("EMPTY SHOT!", "#aaa");
      return;
    }

    targetItem.snapped = true;

    if (targetItem.isSavory) {
      if (minDist < 22) {
        score += 20;
        showFeedback("PERFECT SNAP! +20", "#2ec4b6");
      } else {
        score += 10;
        showFeedback("SAVORY! +10", "#ff9f1c");
      }
      scoreEl.textContent = score;
      speed = Math.min(10, 3.5 + score * 0.015); // Gradually increase speed
    } else {
      loseLife("NOT SAVORY!");
    }
  }

  canvas.addEventListener("pointerdown", handleSnap);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleSnap();
  });

  function startGame() {
    score = 0;
    lives = 3;
    speed = 3.5;
    items = [];
    spawnTimer = 0;
    flashAlpha = 0;
    feedbackTimer = 0;
    isRunning = true;

    scoreEl.textContent = "0";
    livesEl.textContent = "❤️❤️❤️";
    startScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  document.getElementById("start-btn").addEventListener("click", startGame);
  document.getElementById("restart-btn").addEventListener("click", startGame);

  function loop() {
    if (!isRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const zone = getTargetZone();

    // 1. Draw Conveyor Belt
    const beltY = canvas.height / 2 - 55;
    ctx.fillStyle = "#362f2b";
    ctx.fillRect(0, beltY, canvas.width, 110);

    // Belt moving stripes
    beltOffset = (beltOffset + speed) % 40;
    ctx.strokeStyle = "#4a403a";
    ctx.lineWidth = 4;
    for (let x = -40 + beltOffset; x < canvas.width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, beltY);
      ctx.lineTo(x, beltY + 110);
      ctx.stroke();
    }

    // 2. Spawn & Update Food Items
    spawnTimer++;
    const spawnInterval = Math.max(42, Math.floor(110 - speed * 6));
    if (spawnTimer >= spawnInterval) {
      spawnItem();
      spawnTimer = 0;
    }

    ctx.font = "54px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.x += speed;

      // Plate circle under food
      ctx.fillStyle = item.snapped ? "rgba(255,255,255,0.2)" : "#f4f1de";
      ctx.beginPath();
      ctx.arc(item.x, item.y, 38, 0, Math.PI * 2);
      ctx.fill();

      // Food emoji
      ctx.globalAlpha = item.snapped ? 0.35 : 1;
      ctx.fillText(item.emoji, item.x, item.y + 4);
      ctx.globalAlpha = 1;

      // Check if a savory dish passed without being snapped
      if (!item.snapped && !item.missed && item.x > zone.x + zone.w + 30) {
        item.missed = true;
        if (item.isSavory) {
          loseLife("MISSED SAVORY!");
        }
      }

      // Remove off-screen items
      if (item.x > canvas.width + 60) {
        items.splice(i, 1);
      }
    }

    // 3. Draw Camera Viewfinder Frame
    ctx.strokeStyle = "#ff9f1c";
    ctx.lineWidth = 4;
    ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);

    // Center focus crosshair
    ctx.strokeStyle = "rgba(255, 159, 28, 0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(zone.centerX, zone.y + 10);
    ctx.lineTo(zone.centerX, zone.y + zone.h - 10);
    ctx.stroke();

    // 4. Draw Floating Feedback Text
    if (feedbackTimer > 0) {
      ctx.fillStyle = feedbackColor;
      ctx.font = "bold 22px sans-serif";
      ctx.fillText(feedbackText, canvas.width / 2, zone.y - 30 - (40 - feedbackTimer) * 0.5);
      feedbackTimer--;
    }

    // 5. Camera Shutter Flash Effect
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      flashAlpha -= 0.08;
    }

    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
